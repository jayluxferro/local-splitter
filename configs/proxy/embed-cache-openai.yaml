# Embedding semantic cache, OpenAI-compatible cloud — the doublewordai-chain variant
#
# Mirror of embed-cache.yaml for chains whose cloud hop speaks the
# OpenAI-compatible wire format: the cloud backend is openai_compat with a
# /v1 endpoint, instead of embed-cache.yaml's anthropic backend.  Everything
# else is identical: T1/T2/T4 structurally off, T3 on the pgvector embedding
# backend (cosine over embeddinggemma-2:740m, threshold 0.95), and a local
# ollama section that exists for the embedder only.
#
# Why no api_key_env: in the manifold chain this service sits mid-chain and
# the caller's auth headers flow through to the upstream hop; an env-sourced
# key is only needed when talking to the cloud API directly.
#
# Requirements: the cache Postgres (LOCAL_SPLITTER_DB_URL) needs pgvector;
# ollama needs embeddinggemma-2:740m pulled and ollama >= 0.40.0.  Lookups
# and stores fail open (cache miss) if either is missing.

version: 1

models:
  local:
    backend: ollama
    endpoint: http://127.0.0.1:11434
    chat_model: llama3.2:3b  # unused — T1/T2/T4 disabled
    embed_model: embeddinggemma-2:740m
    num_ctx: 8192

  cloud:
    backend: openai_compat
    endpoint: http://127.0.0.1:8765/v1
    chat_model: claude-sonnet-4-20250514

pipeline:
  tools_require_cloud: true
  t1_route:      { enabled: false }
  t2_compress:   { enabled: false }
  t3_sem_cache:
    enabled: true
    backend: embedding
    similarity_threshold: 0.95
    ttl: 86400
  t4_draft:      { enabled: false }
  t5_diff:       { enabled: false }
  t6_intent:     { enabled: false }
  t7_batch:      { enabled: false }
